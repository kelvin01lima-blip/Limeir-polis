<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limeirópolis - Banco Imobiliário</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* CORES DE LIMEIRA FUTURISTA */
            --lime-green: #10b981;
            --lime-neon: #34d399;
            --lime-yellow: #fbbf24;
            --lime-gold: #f59e0b;
            --lime-blue: #0284c7;
            --dark-bg: #020617;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --text-light: #f8fafc;
            --danger-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        
        body {
            background: radial-gradient(circle at center, #0f172a 0%, var(--dark-bg) 100%);
            color: var(--text-light); width: 100vw; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center; position: relative;
        }

        /* HUD SUPERIOR - INFO DO JOGADOR ATUAL */
        .hud-top {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); backdrop-filter: blur(12px); border: 2px solid var(--lime-neon);
            border-radius: 20px; padding: 15px 30px; box-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
            display: flex; align-items: center; gap: 20px; z-index: 100;
        }
        .hud-pawn { font-size: 38px; filter: drop-shadow(0 0 10px var(--lime-neon)); }
        .hud-info { display: flex; flex-direction: column; }
        .hud-title { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900; color: var(--lime-neon); text-transform: uppercase; letter-spacing: 1px; }
        .hud-name { font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .hud-money-box { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 12px; border: 1px solid var(--lime-yellow); }
        .hud-cash-icon { font-size: 28px; transform: perspective(100px) rotateY(-15deg); filter: drop-shadow(2px 2px 0px #000); }
        .hud-balance { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: var(--lime-yellow); text-shadow: 0 0 10px var(--lime-yellow); }

        /* TABULEIRO TELA CHEIA */
        .board-stage {
            width: 95vmin; height: 95vmin; max-width: 1000px; max-height: 1000px;
            background: rgba(2, 6, 23, 0.9); border: 4px solid var(--lime-blue);
            border-radius: 20px; box-shadow: 0 0 50px rgba(2, 132, 199, 0.4);
            display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr);
            gap: 2px; padding: 4px; position: relative; z-index: 10;
        }

        .tile {
            background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 4px;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .tile:hover { transform: scale(1.08); z-index: 20; border-color: var(--lime-neon); box-shadow: 0 0 15px var(--lime-neon); }
        .tile.owned { border: 2px solid var(--lime-yellow) !important; background: rgba(251, 191, 36, 0.1); }
        
        .tile-color-bar { height: 8px; border-radius: 4px; margin-bottom: 4px; width: 100%; box-shadow: 0 0 8px currentColor; }
        .tile-title { font-size: 8.5px; font-weight: 900; color: var(--text-light); text-transform: uppercase; text-align: center; word-break: break-word; line-height: 1.1; }
        .tile-price { font-size: 9px; font-weight: 900; color: var(--lime-neon); margin-top: auto; text-align: center; }
        .tile-corner { background: linear-gradient(135deg, #0f172a, #1e293b); border: 2px solid var(--lime-blue); text-align: center; justify-content: center; align-items: center; font-weight: 900; font-size: 10px; color: var(--lime-blue); text-shadow: 0 0 8px var(--lime-blue); }

        .owner-badge { position: absolute; top: 2px; right: 2px; font-size: 14px; filter: drop-shadow(0 0 5px #000); }
        .buildings-container { position: absolute; top: 2px; left: 2px; display: flex; gap: 2px; z-index: 4; }
        .building-house { font-size: 14px; filter: drop-shadow(0 0 5px var(--lime-green)); }
        .building-hotel { font-size: 18px; filter: drop-shadow(0 0 8px var(--danger-red)); }
        .pawn-container { position: absolute; bottom: 2px; left: 2px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 10; }
        .pawn-3d-base { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #cbd5e1 60%, var(--lime-blue) 100%); border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.4s ease; }

        /* CENTRO DO TABULEIRO (DADOS) */
        .board-center-area {
            grid-column: 2 / 11; grid-row: 2 / 11;
            background: radial-gradient(circle at center, rgba(15,23,42,0.8), #020617);
            border-radius: 16px; border: 2px dashed rgba(52, 211, 153, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }
        .city-logo { font-family: 'Orbitron', sans-serif; font-size: 45px; font-weight: 900; color: var(--lime-neon); text-shadow: 0 0 20px var(--lime-neon); text-align: center; line-height: 1; }
        .city-sub { font-size: 14px; font-weight: 800; color: var(--lime-yellow); text-transform: uppercase; letter-spacing: 4px; margin-top: 5px; text-shadow: 0 0 10px var(--lime-yellow); }

        .dice-3d-stage { perspective: 800px; display: flex; gap: 30px; margin: 30px 0; }
        .cube-dice { width: 70px; height: 70px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cube-face { position: absolute; width: 70px; height: 70px; background: #fff; border: 3px solid #000; border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
        .dot { background: #000; border-radius: 50%; width: 12px; height: 12px; margin: auto; }

        /* DOCK DE AÇÕES INFERIOR */
        .action-dock {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100;
        }
        .btn-dock {
            background: var(--glass-bg); border: 2px solid var(--lime-blue); backdrop-filter: blur(10px);
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900;
            padding: 15px 25px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.2s; text-transform: uppercase;
        }
        .btn-dock:hover { transform: translateY(-5px); box-shadow: 0 15px 40px var(--lime-blue); background: var(--lime-blue); }
        .btn-roll { background: linear-gradient(135deg, var(--lime-gold), #ea580c); border-color: var(--lime-gold); font-size: 16px; padding: 15px 35px; }
        .btn-roll:hover { background: linear-gradient(135deg, #ea580c, #c2410c); box-shadow: 0 15px 40px var(--lime-gold); }
        .btn-danger { border-color: var(--danger-red); color: var(--danger-red); }
        .btn-danger:hover { background: var(--danger-red); color: #fff; box-shadow: 0 15px 40px var(--danger-red); }

        /* MODAIS E ALERTAS CUSTOMIZADOS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 500; justify-content: center; align-items: center; }
        .modal-content { background: var(--glass-bg); border: 3px solid var(--lime-neon); border-radius: 24px; width: 90%; max-width: 550px; padding: 30px; box-shadow: 0 0 50px rgba(52, 211, 153, 0.4); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; text-align: center; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: var(--lime-neon); margin-bottom: 15px; text-transform: uppercase; }
        .modal-text { font-size: 16px; line-height: 1.5; color: var(--text-light); margin-bottom: 20px; font-weight: 600; }
        
        .btn-modal { width: 100%; padding: 15px; border-radius: 12px; border: none; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: all 0.2s; }
        .btn-modal-green { background: var(--lime-neon); color: #000; box-shadow: 0 0 15px var(--lime-neon); }
        .btn-modal-green:hover { background: #10b981; }
        .btn-modal-red { background: var(--danger-red); color: #fff; box-shadow: 0 0 15px var(--danger-red); }
        .btn-modal-outline { background: transparent; border: 2px solid var(--text-light); color: var(--text-light); }

        /* CARTAS E PROPRIEDADES NO MODAL */
        .props-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .title-deed-card { background: #fff; color: #000; border-radius: 12px; padding: 15px; border: 4px solid #000; font-family: 'Plus Jakarta Sans', sans-serif; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: left; }
        .deed-header { text-align: center; padding: 10px; border: 2px solid #000; margin-bottom: 10px; border-radius: 6px; }
        .deed-header-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; text-transform: uppercase; }
        .deed-table { width: 100%; font-size: 12px; border-collapse: collapse; margin-bottom: 10px; }
        .deed-table td { padding: 4px 0; border-bottom: 1px dashed #666; font-weight: 800; }
        .deed-table td:last-child { text-align: right; font-weight: 900; }

        /* ANIMAÇÃO DE CAMPEÃO */
        .victory-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .vic-pawn { font-size: 120px; filter: drop-shadow(0 0 50px var(--lime-yellow)); animation: spinVic 4s linear infinite; margin-bottom: 20px; }
        @keyframes spinVic { 0% { transform: rotateY(0deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.2); } 100% { transform: rotateY(360deg) scale(1); } }
        .vic-title { font-family: 'Orbitron', sans-serif; font-size: 60px; font-weight: 900; color: var(--lime-yellow); text-shadow: 0 0 30px var(--lime-gold); text-transform: uppercase; }

        /* SETUP INICIAL (REAPROVEITADO) */
        .setup-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--dark-bg); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .setup-card { background: var(--glass-bg); border: 2px solid var(--lime-blue); border-radius: 24px; width: 90%; max-width: 650px; padding: 40px; text-align: center; }
        .p-input-card { background: rgba(0,0,0,0.5); border: 1px solid var(--lime-blue); border-radius: 12px; padding: 15px; margin-bottom: 10px; text-align: left; }
        .p-input-card input, .p-input-card select { width: 100%; padding: 10px; border-radius: 8px; background: #fff; color: #000; font-weight: 800; font-size: 14px; margin-top: 5px; }
    </style>
</head>

<script>
    /* =========================================
       SISTEMA DE ÁUDIO REALISTA (WEB AUDIO API)
       ========================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playDiceSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        for(let i=0; i<4; i++) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100 + Math.random()*200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }, i * 100);
        }
    }

    function playKachingSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        // Ping metálico
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(2500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        
        // Gaveta abrindo (ruído)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc2.start(); osc2.stop(audioCtx.currentTime + 0.15);
    }

    function playVictoryFanfare() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i*0.2);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime + i*0.2);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.2 + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + i*0.2);
            osc.stop(audioCtx.currentTime + i*0.2 + 0.4);
        });
    }

        { id: 32, nome: "Hípica", preco: 260, cor: "#10b981", tipo: "prop", t: 22, c: 44, c1: 110, c2: 330, c3: 800, h: 1150, custoConst: 150 },
        { id: 33, nome: "SORTE/REVÉS", preco: 0, cor: "#8b5cf6", tipo: "carta" },
        { id: 34, nome: "Ponte Esqueleto", preco: 280, cor: "#10b981", tipo: "prop", t: 24, c: 48, c1: 120, c2: 360, c3: 850, h: 1200, custoConst: 150 },
        { id: 35, nome: "SORTE/REVÉS", preco: 0, cor: "#8b5cf6", tipo: "carta" },
        { id: 36, nome: "Prada", preco: 400, cor: "#a855f7", tipo: "prop", t: 45, c: 90, c1: 210, c2: 600, c3: 1300, h: 1850, custoConst: 220 },
        { id: 37, nome: "Taxa Joias", preco: 0, cor: "#64748b", tipo: "imposto" },
        { id: 38, nome: "Fazenda", preco: 460, cor: "#a855f7", tipo: "prop", t: 65, c: 130, c1: 260, c2: 750, c3: 1700, h: 2400, custoConst: 220 },
        { id: 39, nome: "SORTE/REVÉS", preco: 0, cor: "#8b5cf6", tipo: "carta" }
    ];

    let qtdJogadores = 2;
    let jogadores = [];
    let turno = 0;
    let donos = {};
    let construcoes = {};
    let resolvendoDivida = false;
    let acaoPendente = null;

    /* =========================================
       INICIALIZAÇÃO E UI
       ========================================= */
    function definirQtd(q) {
        qtdJogadores = q;
        const cont = document.getElementById('setup-inputs');
        cont.innerHTML = '';
        for(let i=0; i<q; i++) {
            let opts = peoesLimeira.map((p,idx) => `<option value="${p.icone}" ${idx===i?'selected':''}>${p.nome}</option>`).join('');
            cont.innerHTML += `
                <div class="p-input-card">
                    <label style="color:var(--lime-neon); font-size:12px;">Jogador ${i+1}</label>
                    <input type="text" id="pname-${i}" value="Jogador ${i+1}">
                    <select id="ppeao-${i}">${opts}</select>
                </div>
            `;
        }
    }

    function iniciarJogo() {
        jogadores = [];
        for(let i=0; i<qtdJogadores; i++) {
            jogadores.push({
                id: i+1,
                nome: document.getElementById(`pname-${i}`).value || `J${i+1}`,
                peao: document.getElementById(`ppeao-${i}`).value,
                dinheiro: 1500, pos: 0, ativo: true
            });
        }
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('board').style.display = 'grid';
        document.getElementById('hud-top').style.display = 'flex';
        document.getElementById('action-dock').style.display = 'flex';
        renderizarTabuleiro();
        atualizarTurnoUI();
    }

    function renderizarTabuleiro() {
        const board = document.getElementById('board');
        const gridPos = [
            [11,11],[11,10],[11,9],[11,8],[11,7],[11,6],[11,5],[11,4],[11,3],[11,2],
            [11,1],[10,1],[9,1],[8,1],[7,1],[6,1],[5,1],[4,1],[3,1],[2,1],
            [1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[1,10],
            [1,11],[2,11],[3,11],[4,11],[5,11],[6,11],[7,11],[8,11],[9,11],[10,11]
        ];

        casas.forEach((c, i) => {
            let t = document.createElement('div');
            t.className = `tile ${c.tipo==='canto'?'tile-corner':''}`;
            t.id = `tile-${i}`;
            t.style.gridRow = gridPos[i][0]; t.style.gridColumn = gridPos[i][1];
            
            if(c.tipo === 'canto') {
                t.innerHTML = `<div>${c.nome}</div>`;
            } else {
                t.innerHTML = `<div class="tile-color-bar" style="background:${c.cor};"></div><div class="tile-title">${c.nome}</div><div class="tile-price">${c.preco?'$'+c.preco:''}</div>`;
            }
            
            t.innerHTML += `<div class="buildings-container" id="build-${i}"></div><div class="pawn-container" id="pawnbox-${i}"></div>`;
            board.appendChild(t);
        });
        atualizarPeoes();
    }

    function atualizarPeoes() {
        casas.forEach((_,i) => document.getElementById(`pawnbox-${i}`).innerHTML = '');
        jogadores.filter(j=>j.ativo).forEach(p => {
            document.getElementById(`pawnbox-${p.pos}`).innerHTML += `<div class="pawn-3d-base">${p.peao}</div>`;
        });
    }

    function atualizarTurnoUI() {
        if(verificarVitoria()) return;
        
        let j = jogadores[turno];
        if(!j.ativo) { passarTurno(); return; }

        document.getElementById('hud-name').innerText = j.nome;
        document.getElementById('hud-pawn').innerText = j.peao;
        document.getElementById('hud-balance').innerText = `$ ${j.dinheiro}`;
        
        // Cores do HUD baseadas na saúde financeira
        document.getElementById('hud-balance').style.color = j.dinheiro < 0 ? 'var(--danger-red)' : 'var(--lime-yellow)';
        document.getElementById('btn-roll').style.display = resolvendoDivida ? 'none' : 'flex';
    }

    /* =========================================
       SISTEMA DE MODAIS CUSTOMIZADOS
       ========================================= */
    function abrirAlerta(titulo, msg, botoesHTML) {
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-texto').innerHTML = msg;
        document.getElementById('alerta-botoes').innerHTML = botoesHTML || `<button class="btn-modal btn-modal-green" onclick="fecharAlerta()">ENTENDIDO</button>`;
        document.getElementById('modal-alerta').style.display = 'flex';
    }
    function fecharAlerta() { document.getElementById('modal-alerta').style.display = 'none'; }

    /* =========================================
       MECÂNICA DE DADOS E MOVIMENTO
       ========================================= */
    function jogarDados() {
        let j = jogadores[turno];
        document.getElementById('btn-roll').style.display = 'none';
        
        const c1 = document.getElementById('cube1'); const c2 = document.getElementById('cube2');
        let giros = 0;
        playDiceSound();

        let int = setInterval(() => {
            c1.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;
            c2.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;
            giros++;
            if(giros > 8) {
                clearInterval(int);
                let d1 = Math.floor(Math.random()*6)+1; let d2 = Math.floor(Math.random()*6)+1;
                c1.style.transform = 'rotateX(0) rotateY(0)'; c2.style.transform = 'rotateX(0) rotateY(0)';
                c1.querySelector('.cube-face').innerHTML = `<div style="grid-area:2/2; font-size:30px; font-weight:900;">${d1}</div>`;
                c2.querySelector('.cube-face').innerHTML = `<div style="grid-area:2/2; font-size:30px; font-weight:900;">${d2}</div>`;
                
                moverPeao(j, d1+d2);
            }
        }, 100);
    }

    function moverPeao(j, passos) {
        let pRestantes = passos;
        let int = setInterval(() => {
            j.pos = (j.pos + 1) % 40;
            if(j.pos === 0) {
                j.dinheiro += 200; playKachingSound();
            }
            atualizarPeoes();
            pRestantes--;
            if(pRestantes === 0) {
                clearInterval(int);
                avaliarCasa(j);
            }
        }, 200);
    }

    function avaliarCasa(j) {
        atualizarTurnoUI();
        const c = casas[j.pos];
        
        if (c.tipo === 'canto' || c.tipo === 'imposto' || c.tipo === 'especial' || c.tipo === 'carta') {
            abrirAlerta('CASA ESPECIAL', `Você parou em: <strong>${c.nome}</strong>. Regras aplicadas automaticamente.`, `<button class="btn-modal btn-modal-green" onclick="passarTurnoEFechar()">CONTINUAR</button>`);
        } else if (c.preco > 0) {
            let dono = donos[c.id];
            if (!dono) {
                abrirAlerta(`COMPRAR IMÓVEL?`, `Avenida: <strong>${c.nome}</strong><br>Valor: $${c.preco}`, `
                    <button class="btn-modal btn-modal-green" onclick="comprarImovel(${c.id})">COMPRAR 💳</button>
                    <button class="btn-modal btn-modal-outline" onclick="passarTurnoEFechar()">PASSAR</button>
                `);
            } else if (dono !== j.id) {
                let jDono = jogadores.find(x => x.id === dono);
                let aluguel = c.t; // simplificado
                pagarAluguel(j, jDono, aluguel, c.nome);
            } else {
                abrirAlerta('SEU IMÓVEL', `Você caiu na sua propriedade <strong>${c.nome}</strong>.`, `<button class="btn-modal btn-modal-green" onclick="passarTurnoEFechar()">CONTINUAR</button>`);
            }
        }
    }

    /* =========================================
       FINANÇAS, COMPRAS E FALÊNCIA
       ========================================= */
    function comprarImovel(id) {
        let j = jogadores[turno];
        let c = casas[id];
        if (j.dinheiro >= c.preco) {
            j.dinheiro -= c.preco;
            donos[c.id] = j.id;
            playKachingSound();
            document.getElementById(`tile-${c.id}`).classList.add('owned');
            document.getElementById(`tile-${c.id}`).innerHTML += `<span class="owner-badge">${j.peao}</span>`;
            abrirAlerta('COMPRA SUCESSO', `Você adquiriu <strong>${c.nome}</strong> por $${c.preco}!`, `<button class="btn-modal btn-modal-green" onclick="passarTurnoEFechar()">INCRÍVEL</button>`);
            atualizarTurnoUI();
        } else {
            abrirAlerta('SALDO INSUFICIENTE', `Você não tem $${c.preco} para comprar esta propriedade!`, `<button class="btn-modal btn-modal-red" onclick="fecharAlerta()">FECHAR</button>`);
        }
    }

    function pagarAluguel(devedor, credor, valor, rua) {
        if (devedor.dinheiro >= valor) {
            devedor.dinheiro -= valor;
            credor.dinheiro += valor;
            playKachingSound();
            atualizarTurnoUI();
            abrirAlerta('PAGAMENTO DE ALUGUEL', `<strong>${devedor.nome}</strong> caiu na <strong>${rua}</strong> e pagou <strong>$${valor}</strong> de aluguel para <strong>${credor.nome}</strong>.`, `<button class="btn-modal btn-modal-green" onclick="passarTurnoEFechar()">CONFIRMAR 💳</button>`);
        } else {
            devedor.dinheiro -= valor; // Fica negativo
            credor.dinheiro += valor;
            resolvendoDivida = true;
            atualizarTurnoUI();
            abrirAlerta('⚠️ SALDO NEGATIVO!', `Você pagou $${valor} para ${credor.nome} e sua conta ficou negativa em <strong>$${devedor.dinheiro}</strong>!<br><br>Venda suas propriedades ou declare falência para sair do jogo.`, `
                <button class="btn-modal btn-modal-green" onclick="abrirMinhasCartas()">VER IMÓVEIS (VENDER)</button>
                <button class="btn-modal btn-modal-red" onclick="declararFalencia()">DECLARAR FALÊNCIA 🏳️</button>
            `);
        }
    }

    function declararFalencia() {
        let j = jogadores[turno];
        j.ativo = false;
        // Devolve props pro banco
        casas.forEach(c => {
            if (donos[c.id] === j.id) {
                delete donos[c.id];
                let t = document.getElementById(`tile-${c.id}`);
                t.classList.remove('owned');
                let badge = t.querySelector('.owner-badge'); if(badge) badge.remove();
            }
        });
        resolvendoDivida = false;
        atualizarPeoes();
        abrirAlerta('FALÊNCIA DECRETADA', `O jogador <strong>${j.nome}</strong> foi à falência e está fora do jogo!`, `<button class="btn-modal btn-modal-red" onclick="passarTurnoEFechar()">ADEUS</button>`);
    }

    /* =========================================
       CARTAS, VENDAS E MERCADO
       ========================================= */
    function abrirMinhasCartas(idDono) {
        let alvoId = idDono || jogadores[turno].id;
        let alvo = jogadores.find(x => x.id === alvoId);
        
        document.getElementById('imoveis-titulo').innerText = `Imóveis de ${alvo.nome}`;
        let grid = document.getElementById('imoveis-grid');
        grid.innerHTML = '';
        
        let temAlgo = false;
        casas.forEach(c => {
            if (donos[c.id] === alvoId) {
                temAlgo = true;
                let ehMeu = (alvoId === jogadores[turno].id);
                let btnHtml = ehMeu && resolvendoDivida ? 
                    `<button class="btn-modal btn-modal-red" style="font-size:10px; padding:8px;" onclick="venderProBanco(${c.id}, ${c.preco/2})">VENDER PRO BANCO ($${c.preco/2})</button>` : '';

                grid.innerHTML += `
                    <div class="title-deed-card">
                        <div class="deed-header" style="background:${c.cor}; color:#fff;">
                            <div class="deed-header-title">${c.nome}</div>
                        </div>
                        <div style="font-size:11px; text-align:center; font-weight:800;">Valor Pago: $${c.preco}</div>
                        ${btnHtml}
                    </div>
                `;
            }
        });

        if (!temAlgo) grid.innerHTML = `<div style="color:var(--text-light); text-align:center; grid-column:1/-1;">Nenhum imóvel.</div>`;
        document.getElementById('modal-imoveis').style.display = 'flex';
        fecharAlerta();
    }

    function venderProBanco(idCasa, valorVenda) {
        let j = jogadores[turno];
        delete donos[idCasa];
        j.dinheiro += valorVenda;
        playKachingSound();
        
        let t = document.getElementById(`tile-${idCasa}`);
        t.classList.remove('owned');
        let badge = t.querySelector('.owner-badge'); if(badge) badge.remove();

        if (j.dinheiro >= 0) {
            resolvendoDivida = false;
            fecharModalImoveis();
            abrirAlerta('DÍVIDA PAGA!', `Você conseguiu sair do vermelho! Saldo atual: $${j.dinheiro}`, `<button class="btn-modal btn-modal-green" onclick="passarTurnoEFechar()">UFA! CONTINUAR</button>`);
        } else {
            abrirMinhasCartas(); // Atualiza a lista pra continuar vendendo
            atualizarTurnoUI();
        }
    }

    function abrirMercado() {
        let j = jogadores[turno];
        let html = '';
        jogadores.filter(x => x.ativo && x.id !== j.id).forEach(p => {
            html += `<button class="btn-modal btn-modal-outline" style="margin-bottom:10px;" onclick="abrirMinhasCartas(${p.id})">Ver Imóveis de ${p.peao} ${p.nome}</button>`;
        });
        abrirAlerta('MERCADO DE JOGADORES', 'Clique em um jogador para ver os imóveis dele.', html + `<button class="btn-modal btn-modal-red" onclick="fecharAlerta()">CANCELAR</button>`);
    }

    function fecharModalImoveis() { 
        document.getElementById('modal-imoveis').style.display = 'none'; 
        if(resolvendoDivida) {
            abrirAlerta('Atenção', 'Você ainda está com dívida! Venda mais ou declare falência.', `<button class="btn-modal btn-modal-green" onclick="abrirMinhasCartas()">VOLTAR</button><button class="btn-modal btn-modal-red" onclick="declararFalencia()">FALÊNCIA</button>`);
        }
    }

    /* =========================================
       CONTROLE DE TURNO E VITÓRIA
       ========================================= */
    function passarTurno() {
        turno = (turno + 1) % jogadores.length;
        atualizarTurnoUI();
    }

    function passarTurnoEFechar() {
        fecharAlerta();
        passarTurno();
    }

    function verificarVitoria() {
        let vivos = jogadores.filter(j => j.ativo);
        if (vivos.length === 1 && jogadores.length > 1) {
            playVictoryFanfare();
            document.getElementById('vic-pawn').innerText = vivos[0].peao;
            document.getElementById('vic-name').innerText = `${vivos[0].nome} DOMINOU LIMEIRÓPOLIS!`;
            document.getElementById('victory-screen').style.display = 'flex';
            return true;
        }
        return false;
    }

    function reiniciarJogoConfirm() {
        abrirAlerta('REINICIAR PARTIDA?', 'Tem certeza que deseja apagar o jogo atual e recomeçar?', `
            <button class="btn-modal btn-modal-red" onclick="location.reload()">SIM, REINICIAR 🔄</button>
            <button class="btn-modal btn-modal-outline" onclick="fecharAlerta()">CANCELAR</button>
        `);
    }

    window.onload = () => definirQtd(2);
</script>
